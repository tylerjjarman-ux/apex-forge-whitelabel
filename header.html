<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApexForge Academy – Header</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2F3541;--navy-d:#1E222B;--orange:#E8851A;--orange-d:#C2541A;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:Montserrat,"Segoe UI",Arial,sans-serif}
  .bar{position:relative;height:100%;min-height:72px;display:flex;align-items:stretch;
       background:linear-gradient(100deg,var(--navy-d) 0%,var(--navy) 60%,#3A4252 100%);}
  /* subtle conveyor / steel texture */
  .bar::before{content:"";position:absolute;inset:0;opacity:.07;
       background:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 14px);}
  .bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
       background:linear-gradient(90deg,var(--orange-d),var(--orange) 40%,#F5B04A 100%);}
  .brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;
       background:#fff;padding:0 46px 4px 22px;
       clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);}
  .mark{height:52px;width:52px;flex:none}
  .word{display:flex;flex-direction:column;line-height:1}
  .word b{font-weight:800;font-size:26px;letter-spacing:1.5px;color:var(--navy)}
  .word span{margin-top:5px;font-weight:700;font-size:9.5px;letter-spacing:3.2px;color:var(--orange-d);
       display:flex;align-items:center;gap:6px}
  .word span::before,.word span::after{content:"";height:1.5px;width:14px;background:var(--orange)}
  .title{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:flex-end;
       gap:18px;padding:0 28px 4px 12px;color:#fff;text-align:right}
  .title h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .title h1 em{font-style:normal;color:var(--orange)}
  .title p{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#C9CED6;margin-top:3px}
  .divider{width:2px;align-self:center;height:38px;background:var(--orange);opacity:.85}
  @media (max-width:760px){.title p,.divider{display:none}.title h1{font-size:16px}}
  @media (max-width:520px){.title{display:none}.brand{flex:1;clip-path:none;padding-right:22px}}
</style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F29A2E"/><stop offset="1" stop-color="#C2541A"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="50" cy="50" r="33"/></clipPath>
  </defs>
  <path d="M43.2,11.6 L44.2,4.4 L55.8,4.4 L56.8,11.6 L67.0,14.9 L72.2,9.7 L81.5,16.5 L78.1,22.9 L84.4,31.6 L91.6,30.4 L95.2,41.4 L88.6,44.6 L88.6,55.4 L95.2,58.6 L91.6,69.6 L84.4,68.4 L78.1,77.1 L81.5,83.5 L72.2,90.3 L67.0,85.1 L56.8,88.4 L55.8,95.6 L44.2,95.6 L43.2,88.4 L33.0,85.1 L27.8,90.3 L18.5,83.5 L21.9,77.1 L15.6,68.4 L8.4,69.6 L4.8,58.6 L11.4,55.4 L11.4,44.6 L4.8,41.4 L8.4,30.4 L15.6,31.6 L21.9,22.9 L18.5,16.5 L27.8,9.7 L33.0,14.9 Z" fill="#2F3541"/>
  <circle cx="50" cy="50" r="33" fill="#FFFFFF"/>
  <g clip-path="url(#inner)">
    <circle cx="50" cy="50" r="33" fill="url(#og)"/>
    <path d="M10,72 L36,44 L44,52 L58,32 L92,72 Z" fill="#2F3541"/>
    <path d="M58,32 L66,43 L61,41 L57,46 L53,40 Z" fill="#E9ECEF"/>
    <path d="M36,44 L41,49 L38,48 L35,51 L32,48 Z" fill="#E9ECEF"/>
    <path d="M10,86 C30,64 62,60 92,70 L92,74 C64,66 34,70 10,92 Z" fill="#FFFFFF"/>
  </g>
</svg>
      <div class="word"><b>APEXFORGE</b><span>INDUSTRIAL GROUP</span></div>
    </div>
    <div class="title">
      <div>
        <h1>ApexForge <em>Academy</em></h1>
        <p>Building skills &middot; Forging excellence</p>
      </div>
    </div>
  </header>
</body>
</html>
